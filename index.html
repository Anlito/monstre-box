<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120a1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monstre Box">
<title>Monstre Box – Halloween</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #120a1c; color: #f3e9ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; padding: 16px 14px 28px; max-width: 560px; margin: 0 auto; user-select: none; -webkit-user-select: none; }
  h1 { margin: 4px 0 2px; font-size: 26px; text-align: center; letter-spacing: .5px; }
  .astuce { margin: 0 0 16px; text-align: center; font-size: 14px; color: #c8b5dd; }

  #micro {
    width: 100%; border: 3px solid #ff8a1f; border-radius: 22px; padding: 18px 12px;
    background: #2a1636; color: #fff; font-size: 22px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #micro .emoji { font-size: 40px; }
  #ambiance {
    width: 100%; border: 2px solid #9b6bff; border-radius: 18px; padding: 12px; margin: 0 0 6px;
    background: #1f1533; color: #f3e9ff; font-size: 18px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  #ambiance .emoji { font-size: 28px; }
  #ambiance.actif { background: #9b6bff; color: #12052a; animation: pulse 3s ease-in-out infinite; }
  .volume-ambiance { margin: 0 4px 16px; color: #c8b5dd; }
  #micro.actif { background: #ff8a1f; color: #1a0d00; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255,138,31,.25); } }
  #niveau { height: 8px; border-radius: 4px; background: #2a1636; margin: 8px 4px 0; overflow: hidden; }
  #niveau div { height: 100%; width: 0; background: #7dff6b; transition: width .06s linear; }
  #message { min-height: 20px; margin: 8px 2px 14px; font-size: 14px; color: #ffd27a; text-align: center; }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button {
    aspect-ratio: 1 / 1; border: 0; border-radius: 18px; cursor: pointer;
    background: linear-gradient(160deg, #3b1f4f, #24122f); color: #f3e9ff;
    box-shadow: 0 4px 0 #0b0611; font-size: 14px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    transition: transform .06s;
  }
  .pad button .emoji { font-size: 38px; line-height: 1; }
  .pad button.joue { transform: translateY(3px); box-shadow: 0 1px 0 #0b0611; background: linear-gradient(160deg, #6a2f8a, #3b1f4f); }

  #installation { margin: 0 0 14px; text-align: center; }
  #installer { width: 100%; border: 2px solid #7dff6b; border-radius: 16px; padding: 12px; background: #1d3318; color: #e9ffe4; font-size: 17px; font-weight: 700; cursor: pointer; }
  #aide-installation { margin: 6px 0 0; font-size: 14px; color: #c8b5dd; }
  .bas { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  #stop { flex: 0 0 auto; border: 0; border-radius: 14px; padding: 14px 16px; background: #3a3a46; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .volume { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .volume input { flex: 1; accent-color: #ff8a1f; }
</style>
</head>
<body>

<h1>🎃 Monstre Box</h1>
<p class="astuce">Connecte ton enceinte Bluetooth au téléphone, puis appuie !</p>
<div id="installation" hidden>
  <button id="installer" type="button" hidden>📲 Installer l'appli sur le téléphone</button>
  <p id="aide-installation"></p>
</div>

<button id="micro" type="button" aria-pressed="false">
  <span class="emoji">🎤</span><span id="micro-texte">Voix de monstre : ARRÊT</span>
</button>
<div id="niveau" aria-hidden="true"><div></div></div>
<p id="message" role="status"></p>

<button id="ambiance" type="button" aria-pressed="false">
  <span class="emoji" aria-hidden="true">🌫️</span><span id="ambiance-texte">Ambiance angoissante : ARRÊT</span>
</button>
<label class="volume volume-ambiance">Volume ambiance <input id="volume-ambiance" type="range" min="0" max="1.5" step="0.05" value="0.8"></label>

<div class="pad" id="pad"></div>

<div class="bas">
  <button id="stop" type="button">⏹ Stop sons</button>
  <label class="volume">🔊 <input id="volume" type="range" min="0" max="1.5" step="0.05" value="1" aria-label="Volume"></label>
</div>

<script>
"use strict";

/* ===================== Moteur audio ===================== */
let ctx = null, sortie = null, reverb = null, busSons = null, bruitBlanc = null;

function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -8; comp.knee.value = 6; comp.ratio.value = 20;
    comp.attack.value = 0.002; comp.release.value = 0.15;
    sortie = ctx.createGain();
    sortie.gain.value = Number(document.getElementById("volume").value);
    // limiteur doux : arrondit les crêtes au lieu de grésiller dans l'enceinte
    const reduction = gain(0.5), arrondi = distorsion(2);
    sortie.connect(comp); comp.connect(reduction); reduction.connect(arrondi); arrondi.connect(ctx.destination);
    reverb = ctx.createConvolver();
    reverb.buffer = impulsion(3.2, 2.2);
    reverb.connect(sortie);
    nouveauBus();
    // bruit blanc réutilisable (2 s)
    bruitBlanc = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = bruitBlanc.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

function nouveauBus() {
  if (busSons) busSons.disconnect();
  busSons = ctx.createGain();
  busSons.connect(sortie);
  busSons.envoiReverb = ctx.createGain();
  busSons.envoiReverb.gain.value = 1;
  busSons.envoiReverb.connect(reverb);
}

function impulsion(duree, decroissance) {
  const n = Math.floor(ctx.sampleRate * duree);
  const b = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decroissance);
  }
  return b;
}

/* sortie d'un son : direct + part de réverbération */
function vers(noeud, reverbPart = 0.3) {
  noeud.connect(busSons);
  const r = ctx.createGain(); r.gain.value = reverbPart;
  noeud.connect(r); r.connect(busSons.envoiReverb);
}
function gain(v = 0) { const g = ctx.createGain(); g.gain.value = v; return g; }
function osc(type, f) { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; return o; }
function filtre(type, f, q = 1) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
function bruit() { const s = ctx.createBufferSource(); s.buffer = bruitBlanc; s.loop = true; return s; }
function enveloppe(p, t, montee, tenue, descente, pic) {
  p.setValueAtTime(0.0001, t);
  p.linearRampToValueAtTime(pic, t + montee);
  p.setValueAtTime(pic, t + montee + tenue);
  p.exponentialRampToValueAtTime(0.0001, t + montee + tenue + descente);
}
function vibrato(cible, vitesse, profondeur, t, fin) {
  const l = osc("sine", vitesse), g = gain(profondeur);
  l.connect(g); g.connect(cible); l.start(t); l.stop(fin);
}
function courbeAleatoire(n, min, max) {
  const c = new Float32Array(n);
  let v = (min + max) / 2;
  for (let i = 0; i < n; i++) { v += (Math.random() - 0.5) * (max - min) * 0.5; v = Math.min(max, Math.max(min, v)); c[i] = v; }
  return c;
}
function distorsion(k) {
  const w = ctx.createWaveShaper(), n = 1024, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); }
  w.curve = c; return w;
}

/* ===================== Les sons ===================== */
/* bruit filtré et lissé : sert de « grain » irrégulier pour les voix de monstre */
function rugosite(t, duree, vitesse, profondeur) {
  const b = bruit(), f = filtre("lowpass", vitesse), g = gain(profondeur);
  b.connect(f); f.connect(g); b.start(t); b.stop(t + duree);
  return g;
}
/* formants d'une voyelle « aah » */
function formants(source, dest, f1 = 800, f2 = 1200, f3 = 2700) {
  [[f1, 6, 1], [f2, 8, 0.7], [f3, 10, 0.4]].forEach(([f, q, v]) => {
    const b = filtre("bandpass", f, q), g = gain(v * 3);
    source.connect(b); b.connect(g); g.connect(dest);
  });
}
function coup(t, fort, freq = 70, dest = null) {           // impact sourd
  const o = osc("sine", freq), g = gain();
  o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + 0.25);
  o.connect(g); enveloppe(g.gain, t, 0.005, 0.03, 0.3, fort);
  const b = bruit(), f = filtre("lowpass", 500), gb = gain();
  b.connect(f); f.connect(gb); enveloppe(gb.gain, t, 0.002, 0.01, 0.12, fort * 0.6);
  vers(g, 0.25); vers(gb, 0.25);
  o.start(t); o.stop(t + 0.4); b.start(t); b.stop(t + 0.2);
}

/* moteur deux-temps de tronçonneuse : points = [[instant, régime en Hz], …] */
function tronconneuse(t, points, approche = false) {
  const fin = points[points.length - 1][0];
  const m = osc("sawtooth", points[0][1]), m2 = osc("square", points[0][1] / 2);
  const regime = gain(0.1);                                       // sifflement de la chaîne selon le régime
  points.forEach(([dt, v], i) => {
    const methode = i === 0 ? "setValueAtTime" : "linearRampToValueAtTime";
    m.frequency[methode](v, t + dt);
    m2.frequency[methode](v / 2, t + dt);
    regime.gain[methode](Math.min(1, Math.max(0.08, (v - 40) / 140)), t + dt);
  });
  const tremble = rugosite(t, fin, 25, 8); tremble.connect(m.frequency);   // moteur irrégulier
  const dist = distorsion(5), bp = filtre("bandpass", 1100, 0.8), lp = filtre("lowpass", 4000), g = gain();
  const a = gain(0.6), b = gain(0.3);
  m.connect(a); m2.connect(b); a.connect(dist); b.connect(dist); dist.connect(bp); bp.connect(lp); lp.connect(g);
  const n = bruit(), nf = filtre("bandpass", 3500, 2), am = gain(0), amp = gain(0.5);
  n.connect(nf); nf.connect(am); m.connect(amp); amp.connect(am.gain); am.connect(regime); regime.connect(g);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.8, t + 0.05);
  g.gain.setValueAtTime(0.8, t + fin - 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t + fin);
  let sortieT = g;
  if (approche) {                                                 // de loin (étouffé, faible) à tout près
    const loin = filtre("lowpass", 300), vol = gain(0.03);
    loin.frequency.setValueAtTime(300, t); loin.frequency.exponentialRampToValueAtTime(8000, t + fin - 0.5);
    vol.gain.setValueAtTime(0.03, t); vol.gain.exponentialRampToValueAtTime(1.3, t + fin - 0.5);
    g.connect(loin); loin.connect(vol); sortieT = vol;
  }
  vers(sortieT, approche ? 0.35 : 0.15);
  for (const x of [m, m2, n]) { x.start(t); x.stop(t + fin + 0.05); }
}

const sons = {
  /* coup de théâtre : boum grave + grappe de notes stridentes + souffle */
  sursaut(t) {
    coup(t, 2.2, 55);
    const b = bruit(), fb = filtre("lowpass", 9000), gb = gain();
    fb.frequency.setValueAtTime(9000, t); fb.frequency.exponentialRampToValueAtTime(150, t + 1.2);
    b.connect(fb); fb.connect(gb); enveloppe(gb.gain, t, 0.005, 0.05, 1.2, 1.2);
    vers(gb, 0.4); b.start(t); b.stop(t + 1.5);
    const hp = filtre("highpass", 700), g = gain();
    hp.connect(g); enveloppe(g.gain, t, 0.008, 0.25, 2.2, 0.5);
    [1046, 1108, 1174, 1244, 1568, 1661].forEach((f) => {
      const o = osc("sawtooth", f);
      o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(f * 0.97, t + 2.4);
      vibrato(o.frequency, 6 + Math.random() * 3, 12, t, t + 2.6);
      const m = gain(0.15); o.connect(m); m.connect(hp); o.start(t); o.stop(t + 2.6);
    });
    vers(g, 0.6);
  },

  cri(t) {
    const d = 2.4, dist = distorsion(2.5), g = gain();
    const contour = courbeAleatoire(30, 1250, 1550);
    [[1, 0.6], [1.015, 0.5], [0.5, 0.3]].forEach(([r, v]) => {
      const o = osc("sawtooth", 500 * r);
      o.frequency.setValueAtTime(450 * r, t);
      o.frequency.exponentialRampToValueAtTime(1400 * r, t + 0.18);
      o.frequency.setValueCurveAtTime(contour.map((x) => x * r), t + 0.2, 1.5);
      o.frequency.exponentialRampToValueAtTime(500 * r, t + d);
      vibrato(o.frequency, 8, 50 * r, t, t + d);
      const m = gain(v); o.connect(m); m.connect(dist); o.start(t); o.stop(t + d + 0.05);
    });
    const souffle = bruit(), fs = filtre("bandpass", 3000, 1), gs = gain(0.35);
    souffle.connect(fs); fs.connect(gs); gs.connect(dist); souffle.start(t); souffle.stop(t + d);
    formants(dist, g, 950, 1400, 2900);
    enveloppe(g.gain, t, 0.06, 1.6, 0.7, 0.9);
    vers(g, 0.5);
  },

  /* rire grave et lent, « HA… HA… HA… » */
  rire(t) {
    const o = osc("sawtooth", 120), sub = osc("sine", 60), m = gain(0), g = gain(), dist = distorsion(1.8);
    o.connect(dist); sub.connect(m); dist.connect(m);
    const r = rugosite(t, 3.4, 40, 0.5), rg = gain(1); r.connect(rg.gain); m.connect(rg);
    formants(rg, g, 650, 1050, 2400);
    const n = 9;
    for (let i = 0; i < n; i++) {
      const s = t + i * 0.32, h = 150 - i * 6;
      o.frequency.setValueAtTime(h, s); o.frequency.exponentialRampToValueAtTime(h * 0.75, s + 0.25);
      sub.frequency.setValueAtTime(h / 2, s);
      m.gain.setValueAtTime(0, s); m.gain.linearRampToValueAtTime(1, s + 0.03); m.gain.linearRampToValueAtTime(0, s + 0.26);
    }
    g.gain.value = 0.9;
    vers(g, 0.75); o.start(t); sub.start(t); o.stop(t + 3.4); sub.stop(t + 3.4);
  },

  monstre(t) {
    const d = 3, o = osc("sawtooth", 70), sub = osc("sine", 40), dist = distorsion(3), g = gain(), f = filtre("lowpass", 1600);
    o.frequency.setValueCurveAtTime(courbeAleatoire(30, 55, 100), t, d);
    sub.frequency.setValueCurveAtTime(courbeAleatoire(20, 35, 50), t, d);
    const rg = gain(0.5); rugosite(t, d, 70, 0.8).connect(rg.gain);
    o.connect(rg); sub.connect(rg);
    const b = bruit(), fb = filtre("bandpass", 600, 2), gb = gain(0.8);
    fb.frequency.setValueCurveAtTime(courbeAleatoire(20, 350, 900), t, d);
    b.connect(fb); fb.connect(gb); gb.connect(rg);
    rg.connect(dist); dist.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1.6, t + 0.6);
    g.gain.setValueAtTime(1.6, t + d - 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    vers(g, 0.45);
    o.start(t); sub.start(t); b.start(t); o.stop(t + d); sub.stop(t + d); b.stop(t + d);
  },

  /* respiration lourde, tout près de l'oreille */
  respiration(t) {
    for (let i = 0; i < 4; i++) {
      const s = t + i * 2.1;
      [[0, 1.0, 1300, 0.5], [1.0, 1.0, 650, 0.8]].forEach(([dec, dur, f, v]) => {
        const b = bruit(), bp = filtre("bandpass", f, 1.5), g = gain();
        bp.frequency.setValueAtTime(f, s + dec); bp.frequency.linearRampToValueAtTime(f * 1.3, s + dec + dur);
        b.connect(bp); bp.connect(g);
        g.gain.setValueAtTime(0.0001, s + dec);
        g.gain.linearRampToValueAtTime(v * 2, s + dec + dur * 0.4);
        g.gain.exponentialRampToValueAtTime(0.0001, s + dec + dur);
        vers(g, 0.05); b.start(s + dec); b.stop(s + dec + dur + 0.05);
      });
      const r = osc("sawtooth", 45), rg = gain();              // râle
      r.connect(rg); enveloppe(rg.gain, s + 1.1, 0.2, 0.4, 0.3, 0.05);
      vers(rg, 0.05); r.start(s + 1.1); r.stop(s + 2.1);
    }
  },

  /* voix chuchotées incompréhensibles, à gauche et à droite */
  chuchote(t) {
    const voyelles = [[300, 2300], [700, 1200], [500, 1000], [400, 2000], [650, 1700], [350, 900]];
    [-0.8, 0.8].forEach((cote, v) => {
      const d = 4.5, b = bruit(), f1 = filtre("bandpass", 500, 7), f2 = filtre("bandpass", 1500, 9), g = gain(0);
      b.connect(f1); b.connect(f2); f1.connect(g); f2.connect(g);
      const debut = t + v * 0.35;
      for (let s = debut; s < debut + d; s += 0.11 + Math.random() * 0.1) {
        const [a, c] = voyelles[Math.floor(Math.random() * voyelles.length)];
        f1.frequency.setTargetAtTime(a, s, 0.02); f2.frequency.setTargetAtTime(c, s, 0.02);
        g.gain.setTargetAtTime(Math.random() < 0.25 ? 0 : 2.5 + Math.random() * 2, s, 0.03);
      }
      g.gain.setTargetAtTime(0, debut + d, 0.05);
      const hs = filtre("highpass", 5000), gs = gain(0);
      b.connect(hs); hs.connect(gs); gs.connect(g);                                   // sifflantes « sss »
      for (let k = 0; k < 5; k++) { const x = debut + Math.random() * d; gs.gain.setTargetAtTime(0.6, x, 0.02); gs.gain.setTargetAtTime(0, x + 0.12, 0.03); }
      let dest = g;
      if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = cote; g.connect(p); dest = p; }
      vers(dest, 0.35); b.start(debut); b.stop(debut + d + 0.3);
    });
  },

  /* cordes qui crissent : glissandos aigus et dissonants */
  cordes(t) {
    const d = 3.2, hp = filtre("highpass", 1200), g = gain();
    hp.connect(g);
    for (let i = 0; i < 4; i++) {
      const o = osc("sawtooth", 2000);
      o.frequency.setValueCurveAtTime(courbeAleatoire(12, 1700 + i * 150, 2700 + i * 150), t, d);
      vibrato(o.frequency, 6 + i, 35, t, t + d);
      const m = gain(0.2); o.connect(m); m.connect(hp); o.start(t); o.stop(t + d);
    }
    for (let k = 0; k < 6; k++) {                                // coups d'archet
      const s = t + k * 0.5;
      g.gain.setValueAtTime(0.15, s); g.gain.linearRampToValueAtTime(0.9, s + 0.04); g.gain.linearRampToValueAtTime(0.35, s + 0.45);
    }
    g.gain.setValueAtTime(0.35, t + d - 0.25); g.gain.linearRampToValueAtTime(0, t + d);
    vers(g, 0.55);
  },

  /* montée d'angoisse : grave dissonant qui enfle… puis coupure brutale et boum */
  drone(t) {
    const d = 6, f = filtre("lowpass", 150, 3), g = gain();
    f.frequency.setValueAtTime(150, t); f.frequency.exponentialRampToValueAtTime(2500, t + d);
    [55, 58.3, 82.4, 87.3, 110.5].forEach((n) => {
      const o = osc("sawtooth", n); o.connect(f); o.start(t); o.stop(t + d);
    });
    const sif = osc("sine", 1800), gs = gain();                   // sifflement qui monte
    sif.frequency.setValueAtTime(1800, t); sif.frequency.exponentialRampToValueAtTime(3600, t + d);
    gs.gain.setValueAtTime(0.0001, t); gs.gain.exponentialRampToValueAtTime(0.08, t + d);
    sif.connect(gs); gs.connect(g); sif.start(t); sif.stop(t + d);
    f.connect(g);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + d - 0.05);
    g.gain.linearRampToValueAtTime(0, t + d);
    vers(g, 0.3);
    sons.sursaut(t + d + 0.05);                                   // … BOUM
  },

  coeur(t) {
    let s = t;
    for (let i = 0; i < 12; i++) {
      for (const [dec, fort] of [[0, 1.6], [0.2, 1.1]]) {
        const u = s + dec, o = osc("sine", 70), g = gain();
        o.frequency.setValueAtTime(70, u); o.frequency.exponentialRampToValueAtTime(36, u + 0.14);
        o.connect(g); enveloppe(g.gain, u, 0.01, 0.02, 0.16, fort * (0.6 + i * 0.05));
        vers(g, 0.05); o.start(u); o.stop(u + 0.25);
      }
      s += 0.95 - i * 0.05; // le cœur s'accélère
    }
  },

  porte(t) {
    const d = 3.2, o = osc("sawtooth", 30), g = gain();
    o.frequency.setValueCurveAtTime(courbeAleatoire(50, 12, 55), t, d);
    const f1 = filtre("bandpass", 700, 10), f2 = filtre("bandpass", 1900, 14);
    f1.frequency.setValueAtTime(550, t); f1.frequency.linearRampToValueAtTime(1100, t + d);
    o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g);
    enveloppe(g.gain, t, 0.3, d - 0.7, 0.4, 3.5);
    vers(g, 0.3); o.start(t); o.stop(t + d + 0.1);
    coup(t + d + 0.15, 2.4, 60);                                    // la porte claque
  },

  pas(t) {
    for (let i = 0; i < 9; i++) coup(t + i * 0.7, 0.25 + i * 0.2, 80 - i * 2);
  },

  coups(t) {
    const frappe = (s, fort) => {
      const o = osc("sine", 190), g = gain();
      o.frequency.setValueAtTime(190, s); o.frequency.exponentialRampToValueAtTime(110, s + 0.08);
      o.connect(g); enveloppe(g.gain, s, 0.002, 0.01, 0.12, fort);
      const b = bruit(), f = filtre("bandpass", 1000, 2), gb = gain();
      b.connect(f); f.connect(gb); enveloppe(gb.gain, s, 0.001, 0.005, 0.04, fort * 0.8);
      vers(g, 0.35); vers(gb, 0.35); o.start(s); o.stop(s + 0.2); b.start(s); b.stop(s + 0.08);
    };
    [0, 0.28, 0.56].forEach((d) => frappe(t + d, 1));
    [2.2, 2.38, 2.56, 2.74, 2.92].forEach((d) => frappe(t + d, 1.8));
  },

  tronconneuse(t) {
    const p = [[0, 30], [0.15, 55], [0.3, 32], [0.45, 58], [0.6, 34], [0.9, 48], [1.3, 50],   // cordon puis ralenti
      [1.6, 165], [2.1, 165], [2.5, 50], [2.9, 50], [3.2, 175]];                            // accélérations
    for (let x = 3.3; x < 4.7; x += 0.1) p.push([x, 135 + Math.random() * 40]);           // elle coupe
    p.push([4.8, 170], [5.4, 45], [6.2, 45]);
    tronconneuse(t, p);
  },
  vroum(t) {
    tronconneuse(t, [[0, 50], [0.25, 180], [0.6, 180], [0.8, 60], [1.0, 60], [1.2, 185], [1.5, 185],
      [1.7, 60], [1.85, 60], [2.05, 195], [2.7, 195], [3.1, 45], [3.4, 45]]);
  },
  approche(t) {
    const p = [[0, 140]];
    for (let x = 0.3; x < 6.5; x += 0.3) p.push([x, 120 + Math.random() * 65]);
    p.push([6.8, 190], [7.2, 190]);
    tronconneuse(t, p, true);
  },

  loup(t) {
    const o = osc("sawtooth", 260), o2 = osc("sine", 260), f = filtre("lowpass", 1100, 2), g = gain();
    for (const x of [o, o2]) {
      x.frequency.setValueAtTime(240, t);
      x.frequency.linearRampToValueAtTime(520, t + 0.7);
      x.frequency.linearRampToValueAtTime(580, t + 2.2);
      x.frequency.exponentialRampToValueAtTime(280, t + 3.4);
      vibrato(x.frequency, 5, 7, t, t + 3.5);
    }
    const mo = gain(0.3); o.connect(mo); mo.connect(f); o2.connect(f); f.connect(g);
    enveloppe(g.gain, t, 0.5, 1.9, 1.1, 0.5);
    vers(g, 0.6); o.start(t); o2.start(t); o.stop(t + 3.6); o2.stop(t + 3.6);
  },

  tonnerre(t) {
    const b = bruit(), f = filtre("lowpass", 900), g = gain();
    f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(180, t + 1.5);
    b.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1.6, t + 0.03);
    g.gain.setValueCurveAtTime(courbeAleatoire(30, 0.4, 1.4), t + 0.05, 2);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 5.5);
    vers(g, 0.5); b.start(t); b.stop(t + 5.6);
  },

  chaines(t) {
    for (let i = 0; i < 9; i++) {
      const s = t + i * 0.22 + Math.random() * 0.12;
      for (let k = 0; k < 4; k++) {
        const o = osc("sine", 1800 + Math.random() * 4500), g = gain();
        o.connect(g); enveloppe(g.gain, s, 0.002, 0, 0.08 + Math.random() * 0.25, 0.18);
        vers(g, 0.3); o.start(s); o.stop(s + 0.4);
      }
      const b = bruit(), f = filtre("highpass", 3500), g = gain();
      b.connect(f); f.connect(g); enveloppe(g.gain, s, 0.001, 0, 0.05, 0.5);
      vers(g, 0.2); b.start(s); b.stop(s + 0.1);
    }
  },
};

const pad = [
  ["sursaut", "⚡", "Sursaut"], ["cri", "😱", "Cri"], ["rire", "😈", "Rire du diable"],
  ["monstre", "👹", "Monstre"], ["respiration", "😮‍💨", "Souffle"], ["chuchote", "🤫", "Chuchotements"],
  ["cordes", "🎻", "Cordes"], ["drone", "🌑", "Angoisse"], ["coeur", "💓", "Cœur"],
  ["porte", "🚪", "Porte"], ["pas", "👣", "Pas"], ["coups", "✊", "On frappe"],
  ["loup", "🐺", "Loup"], ["tonnerre", "⛈️", "Tonnerre"], ["chaines", "⛓️", "Chaînes"],
  ["tronconneuse", "🪚", "Tronçonneuse"], ["vroum", "💥", "Vroum vroum"], ["approche", "🏃", "Elle arrive…"],
];

const grille = document.getElementById("pad");
for (const [cle, emoji, nom] of pad) {
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = `<span class="emoji" aria-hidden="true">${emoji}</span><span>${nom}</span>`;
  // « click » et non « pointerdown » : le téléphone n'envoie pas de click quand le doigt glisse
  // pour faire défiler la page, donc faire défiler ne joue plus de son.
  b.addEventListener("click", () => {
    audio();
    sons[cle](ctx.currentTime + 0.02);
    b.classList.add("joue"); setTimeout(() => b.classList.remove("joue"), 150);
  });

document.getElementById("stop").addEventListener("click", () => { if (ctx) nouveauBus(); });
document.getElementById("volume").addEventListener("input", (e) => {
  if (sortie) sortie.gain.setTargetAtTime(Number(e.target.value), ctx.currentTime, 0.03);
});

/* ===================== Ambiance angoissante (sans fin) ===================== */
/* Fabriquée en direct : nappes continues + bruits lointains tirés au hasard.
   Elle tourne tant qu'elle est allumée et ne se répète jamais à l'identique. */
let ambiance = null;
const boutonAmbiance = document.getElementById("ambiance");
const texteAmbiance = document.getElementById("ambiance-texte");
const volumeAmbiance = document.getElementById("volume-ambiance");

const evenementsAmbiance = [   // [son, poids] : plus le poids est grand, plus il revient souvent
  ["porte", 3], ["chuchote", 3], ["pas", 3], ["coups", 2], ["chaines", 2], ["coeur", 2],
  ["respiration", 2], ["loup", 2], ["tonnerre", 1], ["rire", 1], ["cordes", 1], ["cri", 0.5], ["approche", 0.5],
];

function lfo(cible, vitesse, profondeur, t) {
  const l = osc("sine", vitesse), g = gain(profondeur);
  l.connect(g); g.connect(cible); l.start(t);
  return l;
}

function demarrerAmbiance() {
  audio();
  const t = ctx.currentTime + 0.05, sources = [];
  const bus = gain(0);
  bus.gain.setValueAtTime(0, t);
  bus.gain.linearRampToValueAtTime(Number(volumeAmbiance.value), t + 4);   // arrive doucement
  bus.connect(sortie);
  bus.envoiReverb = gain(1); bus.envoiReverb.connect(reverb);

  // 1. grondement grave dissonant, filtre qui respire lentement
  const lp = filtre("lowpass", 350, 4), gd = gain(0.22);
  sources.push(lfo(lp.frequency, 0.025, 220, t));
  [55, 58.3, 82.4, 116.5].forEach((f, i) => {
    const o = osc(i < 2 ? "sawtooth" : "triangle", f);
    sources.push(lfo(o.frequency, 0.05 + i * 0.02, 0.6, t));                // battements qui dérivent
    o.connect(lp); o.start(t); sources.push(o);
  });
  lp.connect(gd); gd.connect(bus);
  const rd = gain(0.15); gd.connect(rd); rd.connect(bus.envoiReverb);

  // 2. vent qui monte et redescend
  const v = bruit(), vf = filtre("bandpass", 500, 4), vg = gain(0.5);
  sources.push(lfo(vf.frequency, 0.06, 300, t), lfo(vg.gain, 0.045, 0.35, t));
  v.connect(vf); vf.connect(vg); vg.connect(bus); v.start(t); sources.push(v);

  // 3. sifflement aigu lointain qui apparaît et disparaît
  const s = osc("sine", 1760), sg = gain(0);
  sources.push(lfo(s.frequency, 0.2, 6, t), lfo(sg.gain, 0.03, 0.025, t));
  s.connect(sg); sg.connect(bus.envoiReverb); s.start(t); sources.push(s);

  // 4. bruits lointains au hasard (plus faibles, plus de réverbération)
  const loin = gain(0.35); loin.connect(bus);
  loin.envoiReverb = gain(1.6); loin.envoiReverb.connect(bus.envoiReverb);
  const total = evenementsAmbiance.reduce((a, [, p]) => a + p, 0);
  let dernier = null;
  function prochainEvenement() {
    if (!ambiance) return;
    let x = Math.random() * total, nom = evenementsAmbiance[0][0];
    for (const [n, p] of evenementsAmbiance) { if ((x -= p) <= 0) { nom = n; break; } }
    if (nom === dernier) nom = "porte" === nom ? "pas" : "porte";               // pas deux fois le même
    dernier = nom;
    const ancien = busSons; busSons = loin;                                      // le son part vers l'ambiance
    try { sons[nom](ctx.currentTime + 0.05); } finally { busSons = ancien; }
    ambiance.minuterie = setTimeout(prochainEvenement, 7000 + Math.random() * 12000);
  }

  ambiance = { bus, sources, minuterie: setTimeout(prochainEvenement, 5000), verrou: null };
  navigator.wakeLock?.request("screen").then((v) => { if (ambiance) ambiance.verrou = v; }).catch(() => {});
  boutonAmbiance.classList.add("actif");
  boutonAmbiance.setAttribute("aria-pressed", "true");
  texteAmbiance.textContent = "Ambiance angoissante : MARCHE";
}

function arreterAmbiance() {
  if (!ambiance) return;
  const a = ambiance; ambiance = null;
  clearTimeout(a.minuterie);
  const t = ctx.currentTime;
  a.bus.gain.cancelScheduledValues(t);
  a.bus.gain.setValueAtTime(a.bus.gain.value, t);
  a.bus.gain.linearRampToValueAtTime(0, t + 1.5);                              // s'éteint doucement
  setTimeout(() => { a.sources.forEach((x) => { try { x.stop(); } catch (e) {} }); a.bus.disconnect(); }, 1700);
  if (a.verrou) a.verrou.release().catch(() => {});
  boutonAmbiance.classList.remove("actif");
  boutonAmbiance.setAttribute("aria-pressed", "false");
  texteAmbiance.textContent = "Ambiance angoissante : ARRÊT";
}

boutonAmbiance.addEventListener("click", () => { ambiance ? arreterAmbiance() : demarrerAmbiance(); });
volumeAmbiance.addEventListener("input", () => {
  if (ambiance) ambiance.bus.gain.setTargetAtTime(Number(volumeAmbiance.value), ctx.currentTime, 0.1);
});

/* ===================== Voix de monstre ===================== */
/* Décaleur de hauteur en temps réel : deux lignes de retard dont la durée glisse,
   en fondu enchaîné (technique classique Web Audio). facteur -1 = une octave plus grave. */
function decaleurHauteur(facteur) {
  const temps = 0.1, fondu = 0.05, sr = ctx.sampleRate, n = Math.floor(temps * sr);
  const rampe = ctx.createBuffer(1, n, sr), fenetre = ctx.createBuffer(1, n, sr);
  const r = rampe.getChannelData(0), w = fenetre.getChannelData(0), nf = fondu * sr;
  for (let i = 0; i < n; i++) {
    r[i] = facteur < 0 ? i / n : (n - i) / n;
    w[i] = i < nf ? Math.sqrt(i / nf) : i >= n - nf ? Math.sqrt(1 - (i - (n - nf)) / nf) : 1;
  }
  const entree = gain(1), sortieD = gain(1);
  const t = ctx.currentTime + 0.05, sources = [];
  [0, temps - fondu].forEach((decalage) => {
    const mod = ctx.createBufferSource(); mod.buffer = rampe; mod.loop = true;
    const prof = gain(0.5 * temps * Math.abs(facteur));
    const retard = ctx.createDelay(1);
    retard.delayTime.value = 0;
    mod.connect(prof); prof.connect(retard.delayTime);
    const fd = ctx.createBufferSource(); fd.buffer = fenetre; fd.loop = true;
    const mix = gain(0); fd.connect(mix.gain);
    entree.connect(retard); retard.connect(mix); mix.connect(sortieD);
    mod.start(t + decalage); fd.start(t + decalage);
    sources.push(mod, fd);
  });
  return { entree, sortie: sortieD, arreter() { sources.forEach((s) => { try { s.stop(); } catch (e) {} }); } };
}

let micro = null; // { flux, noeuds, decaleur, analyse, anim, verrou }
const boutonMicro = document.getElementById("micro");
const texteMicro = document.getElementById("micro-texte");
const message = document.getElementById("message");
const barre = document.querySelector("#niveau div");

boutonMicro.addEventListener("click", () => { micro ? arreterMicro() : demarrerMicro(); });

async function demarrerMicro() {
  audio();
  message.textContent = "";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    message.textContent = "Ici, le navigateur ne donne pas accès au micro. Ouvre la page dans Chrome (Android) ou Safari (iPhone), depuis une adresse https.";
    return;
  }
  let flux;
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
  } catch (e) {
    message.textContent = (window.self !== window.top)
      ? "Le micro est bloqué dans cet aperçu. Ouvre la page directement dans le navigateur du téléphone."
      : "Le micro est refusé. Autorise le micro pour cette page (cadenas à côté de l'adresse), puis réappuie.";
    return;
  }
  const src = ctx.createMediaStreamSource(flux);
  const coupeBas = filtre("highpass", 110);
  // compresseur doux : égalise le volume sans saturer
  const egaliseur = ctx.createDynamicsCompressor();
  egaliseur.threshold.value = -28; egaliseur.knee.value = 12; egaliseur.ratio.value = 4;
  egaliseur.attack.value = 0.005; egaliseur.release.value = 0.2;
  const decaleur = decaleurHauteur(-0.6);              // voix plus grave (≈ -6 demi-tons) mais compréhensible
  const grave = filtre("lowshelf", 200); grave.gain.value = 4;
  const clarte = filtre("peaking", 2500, 1); clarte.gain.value = 4;   // garde les consonnes audibles
  const doux = filtre("lowpass", 6500);
  const voix = gain(0);
  const envoiReverb = gain(0.12);
  const analyse = ctx.createAnalyser(); analyse.fftSize = 512;

  src.connect(coupeBas); coupeBas.connect(analyse); coupeBas.connect(egaliseur); egaliseur.connect(decaleur.entree);
  decaleur.sortie.connect(grave); grave.connect(clarte); clarte.connect(doux); doux.connect(voix);
  voix.connect(sortie); voix.connect(envoiReverb); envoiReverb.connect(reverb);
  voix.gain.setTargetAtTime(1, ctx.currentTime, 0.05);

  let verrou = null;
  try { verrou = await navigator.wakeLock.request("screen"); } catch (e) {}

  micro = { flux, decaleur, voix, noeuds: [src, coupeBas, egaliseur, grave, clarte, doux, voix, envoiReverb, analyse], verrou };
  boutonMicro.classList.add("actif");
  boutonMicro.setAttribute("aria-pressed", "true");
  texteMicro.textContent = "Voix de monstre : MARCHE";
  message.textContent = "Parle ! Éloigne l'enceinte du téléphone pour éviter le sifflement.";

  const donnees = new Uint8Array(analyse.fftSize);
  (function niveau() {
    if (!micro) return;
    analyse.getByteTimeDomainData(donnees);
    let max = 0; for (const v of donnees) max = Math.max(max, Math.abs(v - 128));
    barre.style.width = Math.min(100, max * 1.6) + "%";
    micro.anim = requestAnimationFrame(niveau);
  })();
}

function arreterMicro() {
  if (!micro) return;
  const m = micro; micro = null;
  cancelAnimationFrame(m.anim);
  m.flux.getTracks().forEach((p) => p.stop());
  m.decaleur.arreter();
  m.noeuds.forEach((n) => n.disconnect());
  if (m.verrou) m.verrou.release().catch(() => {});
  barre.style.width = "0";
  boutonMicro.classList.remove("actif");
  boutonMicro.setAttribute("aria-pressed", "false");
  texteMicro.textContent = "Voix de monstre : ARRÊT";
  message.textContent = "";
}

const dejaInstallee = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const zoneInstallation = document.getElementById("installation");
const boutonInstaller = document.getElementById("installer");
const aideInstallation = document.getElementById("aide-installation");
let demandeInstallation = null;

if (!dejaInstallee) {
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    zoneInstallation.hidden = false;
    aideInstallation.textContent = "Pour l'installer sur iPhone : ouvre cette page dans Safari, touche le bouton Partager (carré avec une flèche ⬆️), puis « Sur l'écran d'accueil ».";
  } else {
    // si Chrome ne propose pas l'installation au bout de 4 s, on explique quoi faire
    setTimeout(() => {
      if (demandeInstallation) return;
      zoneInstallation.hidden = false;
      aideInstallation.textContent = "Pour l'installer : ouvre l'adresse anlito.github.io/monstre-box directement dans l'appli Chrome (pas depuis un lien dans une autre appli), puis menu ⋮ → « Installer l'application » ou « Ajouter à l'écran d'accueil ».";
    }, 4000);
  }
}
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  demandeInstallation = e;
  zoneInstallation.hidden = false;
  boutonInstaller.hidden = false;
  aideInstallation.textContent = "";
});
boutonInstaller.addEventListener("click", async () => {
  if (!demandeInstallation) return;
  demandeInstallation.prompt();
  const choix = await demandeInstallation.userChoice.catch(() => null);
  demandeInstallation = null;
  boutonInstaller.hidden = true;
  if (choix && choix.outcome === "accepted") aideInstallation.textContent = "C'est installé : cherche la citrouille sur ton écran d'accueil 🎃";
});
window.addEventListener("appinstalled", () => { zoneInstallation.hidden = true; });
